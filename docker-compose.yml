services:
  recorder:
    image: aurora-harness
    build: .
    entrypoint: ["python", "/opt/agent/proxy.py"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      TRANSCRIPT_DIR: /transcripts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - transcripts:/transcripts
    networks: [internal, egress]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  agent:
    image: aurora-harness
    build: .
    depends_on: [recorder]
    environment:
      OPENROUTER_API_KEY: "sk-dummy"
      OPENROUTER_BASE_URL: "http://recorder:8088/api/v1"
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4-pro}
      LLM_MODEL: ${LLM_MODEL:-}
      CONTEXT_WINDOW_TOKENS: ${CONTEXT_WINDOW_TOKENS:-120000}
      REASONING_EFFORT: ${REASONING_EFFORT:-}
    volumes:
      - diode:/diode
      - state:/state
      - telemetry:/telemetry
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp
      # /work is RAM-backed; its size and mem_limit below must move together
      # (tmpfs pages count against the container's memory cgroup).
      - /work:size=4g,uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 5g
    cpus: 2
    restart: unless-stopped

  diode:
    build:
      context: .
      dockerfile: Dockerfile.diode
    image: aurora-diode
    environment:
      DIODE_DIR: /diode
      # Speech credential. Lives only here: the diode is on the egress network
      # and the agent is on internal, so the agent can cause spend but can
      # never read the key. Empty disables the speak command.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-}
      # Both controls on credentialed spend live here rather than in the
      # console file, which the agent can write: ENABLE_SPEECH decides whether
      # the command can exist at all, and SPEECH_HOURLY_MAX caps its hourly
      # allowance however large a fetch_budget the agent sets.
      ENABLE_SPEECH: ${ENABLE_SPEECH:-}
      SPEECH_HOURLY_MAX: ${SPEECH_HOURLY_MAX:-}
    volumes:
      - diode:/diode
    networks: [egress]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped

  viewer:
    build:
      context: .
      dockerfile: Dockerfile.viewer
    image: aurora-viewer
    profiles: ["viewer"]
    environment:
      TRANSCRIPT_DIR: /transcripts
      VIEWER_PORT: "8090"
    volumes:
      - transcripts:/transcripts:ro
    ports:
      - "127.0.0.1:8090:8090"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    restart: "no"

  stage:
    build:
      context: .
      dockerfile: Dockerfile.stage
    image: aurora-stage
    environment:
      TRANSCRIPT_DIR: /transcripts
      DIODE_DIR: /diode
      TELEMETRY_DIR: /telemetry
      STAGE_CONSOLE_TOKEN: ${STAGE_CONSOLE_TOKEN:-}
      # Optional narrative recap. Empty disables the feature; the key is the
      # stage's own and is never the recorder's upstream credential.
      STAGE_SUMMARY_API_KEY: ${STAGE_SUMMARY_API_KEY:-}
      STAGE_SUMMARY_BASE_URL: ${STAGE_SUMMARY_BASE_URL:-}
      STAGE_SUMMARY_MODEL: ${STAGE_SUMMARY_MODEL:-}
      STAGE_SUMMARY_INTERVAL_SECONDS: ${STAGE_SUMMARY_INTERVAL_SECONDS:-}
      STAGE_COMMENTARY_MODEL: ${STAGE_COMMENTARY_MODEL:-}
      STAGE_COMMENTARY_INTERVAL_SECONDS: ${STAGE_COMMENTARY_INTERVAL_SECONDS:-}
    volumes:
      - transcripts:/transcripts:ro
      - diode:/diode:ro
      - telemetry:/telemetry:ro
    ports:
      - "127.0.0.1:8091:8091"
      - "127.0.0.1:8092:8092"
    networks: [stream]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["stream"]
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    networks: [stream]
    restart: unless-stopped

networks:
  internal:
    internal: true
  egress: {}
  stream: {}

volumes:
  transcripts: {}
  diode: {}
  state: {}
  telemetry: {}
