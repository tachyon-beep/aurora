services:
  recorder:
    image: aurora-harness
    build: .
    entrypoint: ["python", "/opt/agent/proxy.py"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      STREAM_HOURLY_MAX: ${STREAM_HOURLY_MAX:-}
      # Ceiling on any single declared stream's hourly token allowance, the
      # quantity that is billed. Empty keeps the default. core.sock carries no
      # ceiling of any kind; the key budget is its limit.
      STREAM_TOKEN_HOURLY_MAX: ${STREAM_TOKEN_HOURLY_MAX:-}
      # Tokens added to a composed request's max_tokens when reasoning is on,
      # so a declared cap bounds the response rather than being consumed by
      # reasoning. Empty keeps the default; 0 disables the addition.
      STREAM_REASONING_ALLOWANCE: ${STREAM_REASONING_ALLOWANCE:-}
      # Comma-separated OpenRouter model identifiers a declared stream may
      # set, split by modality; the union is the permitted set, published to
      # the agent as /llm/sock/models.json with a per-entry image_input flag.
      # Both empty permits none: a declaration that names a model is
      # rejected, and requests keep the model they were sent with. Declared
      # streams always forward to OpenRouter with OPENROUTER_API_KEY; only
      # core.sock follows LLM_BASE_URL.
      STREAM_MODEL_ALLOW_TEXT: ${STREAM_MODEL_ALLOW_TEXT:-}
      STREAM_MODEL_ALLOW_VISION: ${STREAM_MODEL_ALLOW_VISION:-}
      # Re-aims the declared streams' upstream; only the verification
      # harness sets this, to point them at its stub. Leave unset in
      # normal operation.
      STREAM_UPSTREAM_URL: ${STREAM_UPSTREAM_URL:-}
      TRANSCRIPT_DIR: /transcripts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - transcripts:/transcripts
      - llm_sock:/llm/sock
      - llm_console:/llm/console:ro
    networks: [egress]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Each keep-alive connection holds a thread for its whole life and Linux
    # counts threads against the pids cgroup, so this bounds connection
    # fan-out. Resource hygiene inside the recorder, not a containment control.
    pids_limit: 512
    mem_limit: 512m
    restart: unless-stopped

  agent:
    image: aurora-harness
    build: .
    depends_on: [recorder]
    environment:
      OPENROUTER_API_KEY: "sk-dummy"
      LLM_MODEL: ${LLM_MODEL:-}
      CONTEXT_WINDOW_TOKENS: ${CONTEXT_WINDOW_TOKENS:-120000}
      REASONING_EFFORT: ${REASONING_EFFORT:-}
      # Resource hygiene for the process scheduler, so it cannot exhaust
      # pids_limit or mem_limit below by accident. Not a boundary: processes
      # inside this container can be started without the scheduler.
      PUMP_MAX_ENTRIES: ${PUMP_MAX_ENTRIES:-32}
      PUMP_MAX_CONCURRENT: ${PUMP_MAX_CONCURRENT:-8}
    volumes:
      - llm_sock:/llm/sock:ro
      - llm_console:/llm/console
      - diode:/diode
      - state:/state
      - telemetry:/telemetry
      # Process scheduler entries, state, logs, and whatever else the agent
      # writes there. Mounted into no other service.
      - pump:/pump
      # Disk-backed build area: a preallocated 10 GiB ext4 loop image mounted
      # on the host by scripts/create_build_volume.sh, so a full /build
      # surfaces as ENOSPC and never consumes main-disk space. Wiped by the
      # entrypoint at container start and by the watchdog at each incarnation
      # boundary. The entrypoint warns when the path is not its own
      # filesystem (image not mounted: the size boundary would be absent).
      - ${AURORA_BUILD_DIR:-./volumes/build}:/build
      # Operator-provisioned offline package ecosystems and data files.
      # Written only on the host by scripts/build_vendor.sh and
      # scripts/fetch_corpus.sh; read-only here; mounted nowhere else.
      - ./volumes/vendor:/vendor:ro
      - ./volumes/corpus:/corpus:ro
      # Image frames captured on a ring of fixed slots by the sense service.
      # Written only by sense; read-only here.
      - ./volumes/sense:/sense:ro
    # No network interface at all: one loopback device and an empty routing
    # table. hostname/extra_hosts/dns keep the loopback development surface
    # usable - without them the container's own name does not resolve and
    # /etc/resolv.conf inherits the host's nameserver.
    network_mode: none
    hostname: agent
    extra_hosts:
      - "agent:127.0.0.1"
    dns:
      - 127.0.0.1
    read_only: true
    tmpfs:
      - /tmp
      # /work is RAM-backed; its size and mem_limit below must move together
      # (tmpfs pages count against the container's memory cgroup).
      - /work:size=8g,uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 1024
    mem_limit: 16g
    cpus: 2
    restart: unless-stopped

  diode:
    build:
      context: .
      dockerfile: Dockerfile.diode
    image: aurora-diode
    environment:
      DIODE_DIR: /diode
      # Speech credential. Lives only here: the agent has no network interface,
      # so it can cause spend through the shared /diode volume's closed command
      # vocabulary but can never read the key. Empty disables the speak command.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-}
      # Both controls on credentialed spend live here rather than in the
      # console file, which the agent can write: ENABLE_SPEECH decides whether
      # the command can exist at all, and SPEECH_HOURLY_MAX caps its hourly
      # allowance however large a fetch_budget the agent sets.
      ENABLE_SPEECH: ${ENABLE_SPEECH:-}
      SPEECH_HOURLY_MAX: ${SPEECH_HOURLY_MAX:-}
      # Ceiling on the shared hourly network-operation budget however large a
      # fetch_budget the agent sets: the effective limit at every charging
      # site is min(fetch_budget, DIODE_HOURLY_MAX). Empty keeps the default
      # of 120.
      DIODE_HOURLY_MAX: ${DIODE_HOURLY_MAX:-}
      # Ceiling on a clone command's response size; empty keeps the default.
      CLONE_MAX_BYTES: ${CLONE_MAX_BYTES:-}
    volumes:
      - diode:/diode
    networks: [egress]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped

  sense:
    build:
      context: .
      dockerfile: Dockerfile.sense
    image: aurora-sense
    # docker-init as PID 1: python installs no SIGTERM handler, and without
    # an init a stop would wait out the kill grace period mid-capture.
    init: true
    environment:
      SENSE_DIR: /sense
      SENSE_INTERVAL_MINUTES: ${SENSE_INTERVAL_MINUTES:-10}
      SENSE_RING_SLOTS: ${SENSE_RING_SLOTS:-144}
      SENSE_STATIC_THRESHOLD: ${SENSE_STATIC_THRESHOLD:-2.0}
      # Frames older than this many hours are removed each cycle; 0 keeps a
      # frame until the ring overwrites its slot. 144 slots at 10 minutes
      # and 24 hours both hold one day.
      SENSE_MAX_AGE_HOURS: ${SENSE_MAX_AGE_HOURS:-24}
      # Public video feeds, a JSON list read from .env (see .env.example);
      # unset captures nothing. No credential of any kind is present in this
      # service's environment. The list is read once at start: after editing
      # it, `docker compose up -d sense` recreates this service alone.
      SENSE_FEEDS: '${SENSE_FEEDS:-[]}'
      # yt-dlp cache lands on the tmpfs rather than the read-only rootfs.
      XDG_CACHE_HOME: /tmp
    volumes:
      # Host directory created by scripts/create_sense_volume.sh so it is
      # owned by uid 1000 (senseuser); a missing bind source would be
      # auto-created root-owned and the cap-dropped service could not write.
      - ./volumes/sense:/sense
    # Egress for public feed capture, on a network of its own: sense shares
    # a network with no other service, and the viewer stays alone on the
    # default network.
    networks: [sense_egress]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped

  viewer:
    build:
      context: .
      dockerfile: Dockerfile.viewer
    image: aurora-viewer
    environment:
      TRANSCRIPT_DIR: /transcripts
      VIEWER_PORT: "8090"
    volumes:
      - transcripts:/transcripts:ro
    ports:
      # Host port only; in-container the viewer always serves 8090. The
      # verify harness overrides this so its stack can run beside a live one.
      - "127.0.0.1:${VIEWER_HOST_PORT:-8090}:8090"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    restart: "no"

  stage:
    build:
      context: .
      dockerfile: Dockerfile.stage
    image: aurora-stage
    environment:
      TRANSCRIPT_DIR: /transcripts
      DIODE_DIR: /diode
      TELEMETRY_DIR: /telemetry
      SENSE_DIR: /sense
      STAGE_CONSOLE_TOKEN: ${STAGE_CONSOLE_TOKEN:-}
      # Optional narrative recap. Empty disables the feature; the key is the
      # stage's own and is never the recorder's upstream credential.
      STAGE_SUMMARY_API_KEY: ${STAGE_SUMMARY_API_KEY:-}
      STAGE_SUMMARY_BASE_URL: ${STAGE_SUMMARY_BASE_URL:-}
      STAGE_SUMMARY_MODEL: ${STAGE_SUMMARY_MODEL:-}
      STAGE_SUMMARY_INTERVAL_SECONDS: ${STAGE_SUMMARY_INTERVAL_SECONDS:-}
      STAGE_COMMENTARY_MODEL: ${STAGE_COMMENTARY_MODEL:-}
      STAGE_COMMENTARY_INTERVAL_SECONDS: ${STAGE_COMMENTARY_INTERVAL_SECONDS:-}
      STAGE_ANALYSIS_MODEL: ${STAGE_ANALYSIS_MODEL:-}
      STAGE_ANALYSIS_DURATION_SECONDS: ${STAGE_ANALYSIS_DURATION_SECONDS:-}
    volumes:
      - transcripts:/transcripts:ro
      - diode:/diode:ro
      - telemetry:/telemetry:ro
      # Frames captured by the sense service; written only by sense,
      # read-only here, served on the stream port's /frame/ route.
      - ./volumes/sense:/sense:ro
    ports:
      - "127.0.0.1:${STAGE_STREAM_PORT:-8091}:8091"
      - "127.0.0.1:${STAGE_CONSOLE_PORT:-8092}:8092"
    networks: [stream]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["stream"]
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    networks: [stream]
    restart: unless-stopped

networks:
  egress: {}
  stream: {}
  sense_egress: {}

volumes:
  transcripts: {}
  diode: {}
  state: {}
  telemetry: {}
  llm_sock: {}
  llm_console: {}
  pump: {}
