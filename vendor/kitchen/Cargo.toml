# Kitchen-sink manifest defining the crate set served by the agent's local
# registry. scripts/build_vendor.sh resolves it with the agent-side cargo
# (1.85, MSRV-aware resolver) and syncs the lockfile into a local registry.
# Features are enabled generously here because only lockfile packages are
# synced: a feature the kitchen does not activate is a crate the agent
# cannot resolve.
[package]
name = "kitchen"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"

[dependencies]
# languages and parsing
nom = "7"
pest = "2"
pest_derive = "2"
logos = "0.14"
chumsky = "0.9"
lalrpop = "0.20"
lalrpop-util = { version = "0.20", features = ["lexer"] }
# foundations
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
itertools = "0.13"
rand = { version = "0.8", features = ["small_rng"] }
regex = "1"
indexmap = { version = "2", features = ["serde"] }
num = "0.4"
num-bigint = "0.4"
smallvec = { version = "1", features = ["serde"] }
bitvec = "1"
# concurrency
rayon = "1"
crossbeam = "0.8"
parking_lot = "0.12"
flume = "0.11"
# async and sockets
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
hyperlocal = "0.9"
http = "1"
http-body-util = "0.1"
bytes = "1"
futures = "0.3"
# embedding and substrates
mlua = { version = "0.10", features = ["lua54", "vendored"] }
wasmi = "0.31"
pyo3 = { version = "0.23", features = ["auto-initialize"] }
cc = "1"
libc = "0.2"
# storage and wire formats
sled = "0.34"
bincode = "1"
rmp-serde = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
# testing and interfaces
proptest = "1"
criterion = "0.5"
clap = { version = "4", features = ["derive"] }
rustyline = "14"

[lib]
path = "lib.rs"
